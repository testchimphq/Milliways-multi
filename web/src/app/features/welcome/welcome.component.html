<div class="welcome">
  <img class="hero-bg" src="assets/images/HeroBackground.jpg" alt="" />
  <div class="welcome-content">
    <button type="button" class="account-btn" aria-label="Account" (click)="openAccount()">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path
          fill="currentColor"
          d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
        />
      </svg>
    </button>

    <h1>Welcome to Milliways</h1>

    <img
      class="hero-fg"
      src="assets/images/HeroForeground.png"
      alt=""
      [style.transform]="'translateY(' + (floatOffset() - 40) + 'px)'"
    />

    <button type="button" class="btn-cta" aria-label="New Order" (click)="newOrder()">New Order</button>
  </div>
</div>

@if (showAccount()) {
  <app-account (closed)="closeAccount()" />
}
